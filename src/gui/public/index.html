<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YouTube Comments Extractor</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;max-width:820px;margin:30px auto;padding:0 16px}
    input,select,button{width:100%;padding:8px;margin:6px 0}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    pre{background:#111;color:#0f0;padding:10px;min-height:260px;white-space:pre-wrap}
  </style>
</head>
<body>
  <h2>YouTube Comments Extractor</h2>
  <input id="video" placeholder="video_url_or_id" />
  <input id="key" placeholder="api_key" />
  <input id="out" placeholder="output_folder" value="./output" />
  <div class="grid">
    <select id="order"><option value="time">time</option><option value="relevance">relevance</option></select>
    <input id="sleep_ms" type="number" value="50" placeholder="sleep_ms" />
    <input id="cap_per_thread" type="number" value="5" placeholder="cap_per_thread" />
    <select id="dry_run"><option value="false">dry_run: false</option><option value="true">dry_run: true</option></select>
  </div>
  <button id="start">Start</button>
  <div id="progress">Idle</div>
  <pre id="logs"></pre>
<script>
const logs = document.getElementById('logs');
const progress = document.getElementById('progress');

document.getElementById('start').onclick = async () => {
  progress.textContent = 'Running...';
  logs.textContent = '';
  const payload = {
    video: video.value,
    key: key.value,
    out: out.value,
    order: order.value,
    sleep_ms: Number(sleep_ms.value || 50),
    cap_per_thread: Number(cap_per_thread.value || 5),
    dry_run: dry_run.value === 'true'
  };

  const res = await fetch('/start', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const reader = res.body.getReader();
  const decoder = new TextDecoder('utf-8');
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    logs.textContent += decoder.decode(value, { stream: true });
    logs.scrollTop = logs.scrollHeight;
  }
  progress.textContent = 'Finished';
};
</script>
</body>
</html>
